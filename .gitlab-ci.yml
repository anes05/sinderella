# Use a lightweight Linux image
image: alpine:latest

pages:
  stage: deploy

  script:
    # Create the public folder required by GitLab Pages
    - mkdir -p public

    # Copy your website files (from dev/ folder)
    - cp -r dev/* public

    # Optional: remove unnecessary files
    - rm -rf public/.git

  artifacts:
    paths:
      - public

  rules:
    # Only deploy when pushing to the default branch (main/master)
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

    # Only run if something inside dev/ changed
    - changes:
        - dev/**