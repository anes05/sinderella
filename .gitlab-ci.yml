image: alpine:latest

pages:
  script:
    - mkdir -p public

    # Copy ONLY production-ready files
    - cp index.html about.html blog.html shop.html cart.html checkout.html contact.html wishlist.html product-single.html blog-single.html categories public/

    - cp -r css js images fonts public/

  artifacts:
    paths:
      - public

  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH